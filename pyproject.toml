[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.1.0"
description = "Evidence-centric Git diff security review"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk==0.2.160", "mcp==2.2.0", "tree-sitter==0.25.2", "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4"]

[project.scripts]
security-agent = "security_agent.cli:main"

[tool.setuptools.packages.find]
include = ["security_agent*"]

[tool.setuptools.package-data]
security_agent = ["skills/**/*.json", "skills/**/*.md"]
